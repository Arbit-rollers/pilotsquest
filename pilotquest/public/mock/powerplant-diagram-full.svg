<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Gas-turbine engine schematic (placeholder)</title>
  <desc id="desc">Four labelled sections along the airflow path: inlet, compressor, combustor, turbine.</desc>
  <rect width="800" height="400" fill="#0f172a"/>
  <g stroke="#94a3b8" stroke-width="3" fill="none">
    <path d="M40 200 L760 200" />
  </g>
  <!-- Section 1: inlet -->
  <rect x="40" y="140" width="140" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="110" y="205" fill="#e2e8f0" font-size="42" font-family="sans-serif" text-anchor="middle" font-weight="bold">1</text>
  <!-- Section 2: compressor -->
  <polygon points="200,260 340,220 340,180 200,140" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="270" y="205" fill="#e2e8f0" font-size="42" font-family="sans-serif" text-anchor="middle" font-weight="bold">2</text>
  <!-- Section 3: combustor -->
  <rect x="360" y="150" width="160" height="100" rx="30" fill="#7c2d12" stroke="#fb923c" stroke-width="3"/>
  <text x="440" y="212" fill="#fff7ed" font-size="42" font-family="sans-serif" text-anchor="middle" font-weight="bold">3</text>
  <!-- Section 4: turbine -->
  <polygon points="540,180 540,220 680,260 680,140" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="610" y="205" fill="#e2e8f0" font-size="42" font-family="sans-serif" text-anchor="middle" font-weight="bold">4</text>
  <!-- exhaust -->
  <path d="M680 200 L760 200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
  <text x="400" y="340" fill="#64748b" font-size="18" font-family="sans-serif" text-anchor="middle">Airflow: inlet -&gt; compressor -&gt; combustor -&gt; turbine -&gt; exhaust</text>
</svg>
